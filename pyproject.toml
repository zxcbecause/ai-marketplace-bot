[project]
name = "ai-marketplace-bot"
version = "2.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Ошибки, которые ломают запуск: синтаксис, неопределённые имена, неверные сравнения.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
