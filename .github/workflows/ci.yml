name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-marketplace-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (all modules import on Linux, non-root user, singleton lock)
        run: |
          docker run --rm -e BOT_TOKEN=123:test -e ADMIN_ID=1 -e DEEPSEEK_API_KEY= -e OPENAI_API_KEY= -e GEMINI_API_KEY= -e EXA_API_KEY= --entrypoint python ai-marketplace-bot:ci -c "
          import os, pwd
          assert pwd.getpwuid(os.getuid()).pw_name == 'bot', 'container must not run as root'
          import cv2, torch, PIL, aiogram, openpyxl
          from utils.runtime_env import acquire_singleton_lock, in_docker
          assert in_docker()
          h = acquire_singleton_lock('/app/data/bot.lock'); assert h
          assert acquire_singleton_lock('/app/data/bot.lock') is None
          print('torch', torch.__version__, 'cuda', torch.cuda.is_available())
          import main  # все обработчики и сервисы импортируются на Linux
          print('smoke OK')
          "
